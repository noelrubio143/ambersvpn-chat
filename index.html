<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amber — chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#16130f;
    --bg-panel:#1c1710;
    --bg-panel-2:#221b13;
    --amber-bright:#ffb627;
    --amber-deep:#c97f1d;
    --amber-dim:#7a5620;
    --text-warm:#f2e9dc;
    --text-muted:#8c7e68;
    --border:#332918;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-deep);
    color:var(--text-warm);
    font-family:'IBM Plex Sans', sans-serif;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,182,39,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,182,39,0.04), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  button{font-family:inherit;}
  img, video{max-width:100%; display:block;}


  /* ---------- name entry gate ---------- */
  #gate{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-deep);
    z-index:50;
    flex-direction:column;
    gap:22px;
    padding:24px;
  }
  #gate.hide{display:none;}
  #gate .drop{
    width:52px; height:64px;
    background:linear-gradient(160deg, var(--amber-bright), var(--amber-deep));
    clip-path:path('M26 0C26 0 52 34 52 46C52 56.5 40.3 64 26 64C11.7 64 0 56.5 0 46C0 34 26 0 26 0Z');
    box-shadow:0 0 40px rgba(255,182,39,0.35);
  }
  #gate h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:2rem;
    letter-spacing:0.02em;
  }
  #gate p{color:var(--text-muted); font-size:0.9rem; text-align:center; max-width:320px;}
  #gate .providers{display:flex; flex-direction:column; gap:12px; width:280px;}
  #name-input{
    padding:13px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg-panel);
    color:var(--text-warm);
    font-family:inherit;
    font-size:0.92rem;
    outline:none;
  }
  #name-input:focus{border-color:var(--amber-deep);}
  .provider-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:13px 14px;
    border-radius:8px;
    font-weight:600;
    font-size:0.92rem;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--amber-bright);
    color:#1a1305;
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .provider-btn:hover{transform:translateY(-1px); box-shadow:0 0 18px rgba(255,182,39,0.35);}
  #gate .err{color:#e07a5f; font-size:0.82rem; min-height:1em; text-align:center;}
  #gate .fine{color:var(--text-muted); font-size:0.72rem; text-align:center; max-width:280px;}

  /* ---------- app shell ---------- */
  #app{
    display:none;
    height:100%;
    position:relative;
    z-index:1;
  }
  #app.active{display:flex;}

  aside{
    width:240px;
    background:var(--bg-panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  aside::after{
    content:"";
    position:absolute; top:0; right:-1px; bottom:0; width:6px;
    background:linear-gradient(180deg, transparent, rgba(255,182,39,0.25) 30%, rgba(255,182,39,0.4) 50%, rgba(255,182,39,0.25) 70%, transparent);
    filter:blur(3px);
  }
  .brand{
    padding:20px 18px 16px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border);
  }
  .brand .drop-sm{
    width:16px; height:20px;
    background:linear-gradient(160deg, var(--amber-bright), var(--amber-deep));
    clip-path:path('M8 0C8 0 16 10.5 16 14.3C16 17.5 12.4 20 8 20C3.6 20 0 17.5 0 14.3C0 10.5 8 0 8 0Z');
  }
  .brand span{font-family:'Fraunces', serif; font-weight:500; font-size:1.15rem;}

  .rooms{padding:14px 10px; flex:1; overflow-y:auto;}
  .rooms .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.12em;
    color:var(--text-muted);
    padding:8px 10px 6px;
    text-transform:uppercase;
  }
  .room-btn{
    width:100%;
    text-align:left;
    background:none; border:none;
    color:var(--text-muted);
    padding:9px 10px;
    border-radius:6px;
    font-size:0.9rem;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .room-btn .hex{
    width:8px; height:8px;
    background:var(--amber-dim);
    clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    flex-shrink:0;
  }
  .room-btn:hover{background:var(--bg-panel-2); color:var(--text-warm);}
  .room-btn.active{background:rgba(255,182,39,0.1); color:var(--amber-bright);}
  .room-btn.active .hex{background:var(--amber-bright); box-shadow:0 0 6px var(--amber-bright);}

  .me{
    padding:12px 14px;
    border-top:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  .me img.avatar-img{width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0; border:1px solid var(--border);}
  .me .info{flex:1; min-width:0;}
  .me .name{font-size:0.85rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .me .status{font-size:0.7rem; color:#7ed957; font-family:'IBM Plex Mono', monospace;}
  .me .signout{
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    font-size:0.68rem; padding:4px; flex-shrink:0;
  }
  .me .signout:hover{color:var(--amber-bright);}

  main{flex:1; display:flex; flex-direction:column; min-width:0;}
  header.chat-head{
    padding:14px 24px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
  }
  header.chat-head h2{font-family:'Fraunces', serif; font-weight:500; font-size:1.1rem;}
  header.chat-head .sub{font-size:0.75rem; color:var(--text-muted); font-family:'IBM Plex Mono', monospace;}

  #pinned-bar{
    display:none;
    padding:10px 24px;
    background:rgba(255,182,39,0.08);
    border-bottom:1px solid var(--border);
    font-size:0.8rem;
    color:var(--amber-bright);
    gap:8px;
    align-items:flex-start;
    cursor:pointer;
  }
  #pinned-bar.show{display:flex;}
  #pinned-bar .pin-text{flex:1; color:var(--text-warm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  #messages{
    flex:1;
    overflow-y:auto;
    padding:20px 24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .msg{display:flex; gap:10px; max-width:72%; position:relative;}
  .msg .avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(160deg, var(--amber-deep), var(--amber-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem; font-weight:500;
    color:#1a1305;
    object-fit:cover;
    overflow:hidden;
  }
  .msg .avatar img{width:100%; height:100%; object-fit:cover;}
  .msg .col{display:flex; flex-direction:column; min-width:0;}
  .msg .bubble{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 13px;
    position:relative;
  }
  .msg .who{font-size:0.75rem; color:var(--amber-bright); margin-bottom:3px; font-weight:500; display:flex; align-items:center; gap:5px;}
  .msg .pin-flag{color:var(--amber-bright); font-size:0.7rem;}
  .msg .text{font-size:0.92rem; line-height:1.45; word-wrap:break-word; white-space:pre-wrap;}
  .msg .time{font-size:0.65rem; color:var(--text-muted); margin-top:4px; font-family:'IBM Plex Mono', monospace;}
  .msg .deleted{font-size:0.85rem; color:var(--text-muted); font-style:italic;}

  .msg.mine{align-self:flex-end; flex-direction:row-reverse;}
  .msg.mine .bubble{background:rgba(255,182,39,0.12); border-color:rgba(255,182,39,0.25);}
  .msg.mine .col{align-items:flex-end;}

  .msg .actions{
    display:flex; gap:2px; align-items:center;
    opacity:0; transition:opacity 0.15s ease;
    position:absolute; top:-14px; right:0;
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:16px;
    padding:2px 4px;
  }
  .msg.mine .actions{right:auto; left:0;}
  .msg:hover .actions, .msg.menu-open .actions{opacity:1;}
  .msg .actions button{
    background:none; border:none; cursor:pointer; font-size:0.85rem;
    padding:4px 5px; border-radius:50%; color:var(--text-muted); line-height:1;
  }
  .msg .actions button:hover{color:var(--amber-bright); background:rgba(255,182,39,0.1);}

  .reactions{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;}
  .reactions .chip{
    display:flex; align-items:center; gap:3px;
    background:var(--bg-panel-2); border:1px solid var(--border);
    border-radius:12px; padding:2px 7px; font-size:0.75rem; cursor:pointer;
  }
  .reactions .chip.mine-reacted{border-color:var(--amber-deep); background:rgba(255,182,39,0.12);}
  .reactions .chip:hover{border-color:var(--amber-deep);}

  .emoji-picker{
    position:absolute; top:-42px; right:0; z-index:5;
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:20px;
    padding:6px 8px; display:none; gap:4px;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .msg.mine .emoji-picker{right:auto; left:0;}
  .emoji-picker.show{display:flex;}
  .emoji-picker button{background:none; border:none; font-size:1.1rem; cursor:pointer; padding:2px;}
  .emoji-picker button:hover{transform:scale(1.2);}

  #empty{
    margin:auto;
    text-align:center;
    color:var(--text-muted);
  }
  #empty .drop{
    width:36px; height:44px; margin:0 auto 14px;
    background:linear-gradient(160deg, var(--amber-dim), var(--bg-panel-2));
    clip-path:path('M18 0C18 0 36 24 36 32C36 39 28 44 18 44C8 44 0 39 0 32C0 24 18 0 18 0Z');
    opacity:0.6;
  }
  #empty p{font-size:0.88rem;}

  form#composer{
    padding:14px 24px 20px;
    border-top:1px solid var(--border);
    display:flex; gap:8px;
    align-items:center;
  }
  #composer input[type=text]{
    flex:1;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text-warm);
    padding:12px 16px;
    border-radius:24px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.92rem;
    outline:none;
    min-width:0;
  }
  #composer input[type=text]:focus{border-color:var(--amber-deep);}
  .icon-btn{
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text-muted);
    width:42px; height:42px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-size:1.1rem;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover{border-color:var(--amber-deep); color:var(--amber-bright);}
  #send-btn{
    background:var(--amber-bright);
    color:#1a1305;
    border:none;
    width:44px; height:44px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:box-shadow 0.15s ease;
  }
  #send-btn:hover{box-shadow:0 0 18px rgba(255,182,39,0.4);}
  #send-btn svg{width:18px; height:18px;}
  #composer-emoji{
    position:relative;
  }
  #composer-emoji-picker{
    position:absolute; bottom:52px; right:0;
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:14px;
    padding:8px; display:none; grid-template-columns:repeat(6,1fr); gap:4px; width:220px;
  }
  #composer-emoji-picker.show{display:grid;}
  #composer-emoji-picker button{background:none; border:none; font-size:1.2rem; cursor:pointer; padding:4px;}
  #composer-emoji-picker button:hover{background:var(--bg-panel); border-radius:6px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  @media (max-width:640px){
    aside{position:fixed; left:0; top:0; bottom:0; z-index:20; transform:translateX(-100%); transition:transform 0.2s ease;}
    aside.open{transform:translateX(0);}
    header.chat-head{padding:12px 16px;}
    #messages{padding:16px;}
    form#composer{padding:10px 16px 14px;}
    .msg{max-width:88%;}
  }
  :focus-visible{outline:2px solid var(--amber-bright); outline-offset:2px;}
</style>
</head>
<body>

<!-- ================= NAME ENTRY ================= -->
<div id="gate">
  <div class="drop"></div>
  <h1>Amber</h1>
  <p>Real-time chat. Pick a name to join the room.</p>
  <form id="name-form" class="providers">
    <input id="name-input" type="text" placeholder="Your name" maxlength="24" autocomplete="off" required>
    <button type="submit" class="provider-btn google" style="justify-content:center;">Join chat</button>
  </form>
  <div class="err" id="gate-err"></div>
  <p class="fine">This is a public group chat — anyone in the room can see your name and messages.</p>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="drop-sm"></div>
      <span>Amber</span>
    </div>
    <div class="rooms">
      <div class="label">Rooms</div>
      <div id="room-list"></div>
    </div>
    <div class="me">
      <img class="avatar-img" id="me-avatar" src="" alt="">
      <div class="info">
        <div class="name" id="me-name"></div>
        <div class="status">online</div>
      </div>
      <button class="signout" id="signout-btn" title="Change name">Change name</button>
    </div>
  </aside>

  <main>
    <header class="chat-head">
      <div>
        <h2 id="room-title"># general</h2>
        <div class="sub" id="room-sub">live</div>
      </div>
    </header>
    <div id="pinned-bar">
      <span>📌</span>
      <span class="pin-text" id="pin-text"></span>
    </div>
    <div id="messages">
      <div id="empty">
        <div class="drop"></div>
        <p>No messages yet. Say something.</p>
      </div>
    </div>
    <form id="composer">
      <div id="composer-emoji">
        <button type="button" class="icon-btn" id="emoji-toggle" title="Emoji" aria-label="Emoji">🙂</button>
        <div id="composer-emoji-picker"></div>
      </div>
      <input id="msg-input" type="text" placeholder="Message #general" autocomplete="off" maxlength="1000">
      <button type="submit" id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a1305" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </form>
  </main>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   FIREBASE CONFIG — already filled in for ambervpn-c7814
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDvbz3f2biSJ344LgxyM1hA8SguUgtiMKg",
  authDomain: "ambervpn-c7814.firebaseapp.com",
  projectId: "ambervpn-c7814",
  storageBucket: "ambervpn-c7814.firebasestorage.app",
  messagingSenderId: "735042751832",
  appId: "1:735042751832:web:0b8acee5e418ae6431e92d"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const QUICK_EMOJIS = ['👍','❤️','😂','😮','😢','🔥'];
const COMPOSER_EMOJIS = ['😀','😂','😍','🥰','😎','🤔','😢','😭','😡','🔥','🎉','👍','👎','❤️','🙏','👀','😴','🤝','💯','🥳','😱','🤗','😅','🙃'];

/* ---------------- 48h auto-clear ---------------- */
const AUTO_CLEAR_MS = 48 * 60 * 60 * 1000; // 48 hours
const AUTO_CLEAR_SWEEP_INTERVAL = 5 * 60 * 1000; // check every 5 minutes

async function clearExpiredMessages(room){
  const cutoff = new Date(Date.now() - AUTO_CLEAR_MS);
  try {
    const snap = await db.collection('rooms').doc(room).collection('messages')
      .where('createdAt', '<', cutoff)
      .get();
    if (snap.empty) return;
    // Firestore batches are capped at 500 writes, chunk just in case.
    const docs = snap.docs;
    for (let i = 0; i < docs.length; i += 450) {
      const batch = db.batch();
      docs.slice(i, i + 450).forEach(doc => batch.delete(doc.ref));
      await batch.commit();
    }
  } catch (err) {
    console.error('auto-clear failed for room', room, err);
  }
}

function sweepAllRoomsForExpiredMessages(){
  rooms.forEach(r => clearExpiredMessages(r));
}

/* ---------------- state ---------------- */
let currentUser = null;
let currentRoom = "general";
const rooms = ["general", "random", "help"];
let unsubscribe = null;
let openMenuId = null;

/* ---------------- auth (no OAuth — simple typed name entry) ---------------- */
const app = document.getElementById('app');
const gate = document.getElementById('gate');
const gateErr = document.getElementById('gate-err');
const nameForm = document.getElementById('name-form');
const nameInput = document.getElementById('name-input');

function getSavedName(){
  return localStorage.getItem('amber_name') || '';
}

document.getElementById('signout-btn').onclick = () => {
  localStorage.removeItem('amber_name');
  if (unsubscribe) unsubscribe();
  app.classList.remove('active');
  gate.classList.remove('hide');
  nameInput.value = '';
  nameInput.focus();
};

nameForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = nameInput.value.trim();
  if (!name) return;
  gateErr.textContent = '';
  localStorage.setItem('amber_name', name);
  enterChat(name);
});

auth.signInAnonymously().catch(err => {
  console.error(err);
  gateErr.textContent = 'Connection error — check Firebase config.';
});

function enterChat(name){
  currentUser = currentUser || {};
  currentUser.displayName = name;
  document.getElementById('me-name').textContent = name;
  document.getElementById('me-avatar').src = fallbackAvatar(name);
  gate.classList.add('hide');
  app.classList.add('active');

  // save/update profile
  db.collection('users').doc(currentUser.uid).set({
    name: name,
    photoURL: '',
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(console.error);

  renderRooms();
  joinRoom(currentRoom);

  // clear anything already past 48h, then keep sweeping periodically
  sweepAllRoomsForExpiredMessages();
  if (!window.__amberAutoClearTimer) {
    window.__amberAutoClearTimer = setInterval(sweepAllRoomsForExpiredMessages, AUTO_CLEAR_SWEEP_INTERVAL);
  }
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const saved = getSavedName();
    if (saved) {
      enterChat(saved);
    } else {
      nameInput.focus();
    }
  } else {
    currentUser = null;
    if (unsubscribe) unsubscribe();
    app.classList.remove('active');
    gate.classList.remove('hide');
  }
});

function fallbackAvatar(name){
  const initial = (name || '?').trim()[0]?.toUpperCase() || '?';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="#c97f1d"/><text x="50%" y="55%" font-size="26" fill="#1a1305" text-anchor="middle" font-family="sans-serif">${initial}</text></svg>`;
  return "data:image/svg+xml;base64," + btoa(svg);
}

/* ---------------- room list ---------------- */
const roomList = document.getElementById('room-list');
function renderRooms(){
  roomList.innerHTML = "";
  rooms.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'room-btn' + (r === currentRoom ? ' active' : '');
    btn.innerHTML = `<span class="hex"></span> ${r}`;
    btn.onclick = () => joinRoom(r);
    roomList.appendChild(btn);
  });
}

/* ---------------- messaging ---------------- */
const messagesEl = document.getElementById('messages');
const composer = document.getElementById('composer');
const msgInput = document.getElementById('msg-input');
const roomTitle = document.getElementById('room-title');
const roomSub = document.getElementById('room-sub');
const pinnedBar = document.getElementById('pinned-bar');
const pinText = document.getElementById('pin-text');

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function initials(name){
  return (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
}

function renderMessage(id, data){
  const div = document.createElement('div');
  const mine = data.uid === currentUser.uid;
  div.className = 'msg' + (mine ? ' mine' : '');
  div.dataset.id = id;
  const time = data.createdAt && data.createdAt.toDate
    ? data.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    : '';

  const avatarHtml = data.photoURL
    ? `<img src="${escapeHtml(data.photoURL)}" alt="">`
    : initials(data.name);

  let bodyHtml;
  if (data.deleted) {
    bodyHtml = `<div class="deleted">Message deleted</div>`;
  } else {
    bodyHtml = data.text ? `<div class="text">${escapeHtml(data.text)}</div>` : '';
  }

  const reactions = data.reactions || {};
  let reactionsHtml = '';
  const chips = Object.keys(reactions).filter(e => reactions[e] && reactions[e].length > 0).map(e => {
    const uids = reactions[e];
    const mineReacted = uids.includes(currentUser.uid);
    return `<div class="chip${mineReacted ? ' mine-reacted' : ''}" data-emoji="${e}">${e} ${uids.length}</div>`;
  }).join('');
  if (chips) reactionsHtml = `<div class="reactions">${chips}</div>`;

  const actionsHtml = data.deleted ? '' : `
    <div class="actions">
      <button class="react-open" title="React">🙂</button>
      <button class="pin-toggle" title="${data.pinned ? 'Unpin' : 'Pin'}">📌</button>
      ${mine ? '<button class="delete-btn" title="Delete">🗑️</button>' : ''}
    </div>
    <div class="emoji-picker">
      ${QUICK_EMOJIS.map(e => `<button data-emoji="${e}">${e}</button>`).join('')}
    </div>
  `;

  div.innerHTML = `
    <div class="avatar">${avatarHtml}</div>
    <div class="col">
      <div class="bubble">
        ${actionsHtml}
        ${!mine && !data.deleted ? `<div class="who">${escapeHtml(data.name)}${data.pinned ? '<span class="pin-flag">📌</span>' : ''}</div>` : ''}
        ${mine && data.pinned && !data.deleted ? `<div class="who"><span class="pin-flag">📌 pinned</span></div>` : ''}
        ${bodyHtml}
        <div class="time">${time}</div>
      </div>
      ${reactionsHtml}
    </div>
  `;

  if (!data.deleted) {
    const picker = div.querySelector('.emoji-picker');
    div.querySelector('.react-open').onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll('.emoji-picker.show').forEach(p => { if (p !== picker) p.classList.remove('show'); });
      picker.classList.toggle('show');
    };
    picker.querySelectorAll('button').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        toggleReaction(id, data, btn.dataset.emoji);
        picker.classList.remove('show');
      };
    });
    div.querySelector('.pin-toggle').onclick = (e) => {
      e.stopPropagation();
      togglePin(id, data);
    };
    if (mine) {
      div.querySelector('.delete-btn').onclick = (e) => {
        e.stopPropagation();
        deleteMessage(id);
      };
    }
    div.querySelectorAll('.reactions .chip').forEach(chip => {
      chip.onclick = () => toggleReaction(id, data, chip.dataset.emoji);
    });
  }

  return div;
}

function toggleReaction(id, data, emoji){
  const reactions = data.reactions || {};
  const uids = reactions[emoji] || [];
  const has = uids.includes(currentUser.uid);
  const ref = db.collection('rooms').doc(currentRoom).collection('messages').doc(id);
  ref.update({
    [`reactions.${emoji}`]: has
      ? firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
      : firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
  }).catch(console.error);
}

function togglePin(id, data){
  const ref = db.collection('rooms').doc(currentRoom).collection('messages').doc(id);
  ref.update({ pinned: !data.pinned }).catch(console.error);
}

function deleteMessage(id){
  if (!confirm('Delete this message?')) return;
  const ref = db.collection('rooms').doc(currentRoom).collection('messages').doc(id);
  ref.update({ deleted: true, text: '' }).catch(console.error);
}

function updatePinnedBar(docs){
  const pinned = docs.filter(d => d.data().pinned && !d.data().deleted);
  if (pinned.length === 0) {
    pinnedBar.classList.remove('show');
    return;
  }
  const last = pinned[pinned.length - 1].data();
  pinText.textContent = `${last.name}: ${last.text || ''}`;
  pinnedBar.classList.add('show');
  pinnedBar.onclick = () => {
    const el = messagesEl.querySelector(`[data-id="${pinned[pinned.length - 1].id}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
}

function joinRoom(room){
  currentRoom = room;
  renderRooms();
  roomTitle.textContent = '# ' + room;
  msgInput.placeholder = 'Message #' + room;
  messagesEl.innerHTML = '';

  if (unsubscribe) unsubscribe();

  unsubscribe = db.collection('rooms').doc(room).collection('messages')
    .orderBy('createdAt', 'asc')
    .limitToLast(200)
    .onSnapshot(snapshot => {
      messagesEl.innerHTML = '';
      const cutoffMs = Date.now() - AUTO_CLEAR_MS;
      const visibleDocs = snapshot.docs.filter(doc => {
        const ts = doc.data().createdAt;
        return !ts || !ts.toDate || ts.toDate().getTime() >= cutoffMs;
      });
      if (visibleDocs.length === 0) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.innerHTML = `<div class="drop"></div><p>No messages yet. Say something.</p>`;
        messagesEl.appendChild(empty);
        pinnedBar.classList.remove('show');
        return;
      }
      visibleDocs.forEach(doc => {
        messagesEl.appendChild(renderMessage(doc.id, doc.data()));
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
      roomSub.textContent = 'live · ' + visibleDocs.length + ' messages';
      updatePinnedBar(visibleDocs);
    }, err => {
      roomSub.textContent = 'connection error — check Firebase config';
      console.error(err);
    });
}

/* ---------------- composer emoji picker ---------------- */
const composerEmojiPicker = document.getElementById('composer-emoji-picker');
composerEmojiPicker.innerHTML = COMPOSER_EMOJIS.map(e => `<button type="button">${e}</button>`).join('');
composerEmojiPicker.querySelectorAll('button').forEach(btn => {
  btn.onclick = () => {
    msgInput.value += btn.textContent;
    msgInput.focus();
  };
});
document.getElementById('emoji-toggle').onclick = (e) => {
  e.stopPropagation();
  composerEmojiPicker.classList.toggle('show');
};
document.addEventListener('click', (e) => {
  if (!e.target.closest('#composer-emoji')) composerEmojiPicker.classList.remove('show');
  if (!e.target.closest('.msg')) document.querySelectorAll('.emoji-picker.show').forEach(p => p.classList.remove('show'));
});

/* ---------------- send ---------------- */
composer.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = msgInput.value.trim();
  if (!text) return;

  msgInput.value = '';

  try {
    const now = firebase.firestore.Timestamp.now();
    const expireAt = firebase.firestore.Timestamp.fromMillis(now.toMillis() + AUTO_CLEAR_MS);
    await db.collection('rooms').doc(currentRoom).collection('messages').add({
      uid: currentUser.uid,
      name: currentUser.displayName || 'Amber user',
      photoURL: currentUser.photoURL || '',
      text: text,
      pinned: false,
      deleted: false,
      reactions: {},
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      expireAt: expireAt
    });
  } catch (err) {
    console.error(err);
    roomSub.textContent = 'send failed — check Firebase config';
  }
});
</script>
